name: CI/CD — E2E + Deploy Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript type check
        continue-on-error: true
        run: bun run typecheck 2>&1 | tee /tmp/ts-errors.log | head -20; echo "::warning::TypeScript found pre-existing errors — see full log for details"

      - name: Run ESLint
        continue-on-error: true
        run: bun run lint || echo "::warning::ESLint failed — check .eslintrc.js config availability"

      - name: Run unit tests with coverage
        run: bun run test:ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Run mutation tests (Stryker)
        run: bun run test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(bunx playwright --version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Create .env.production
        run: |
          echo "EXPO_PUBLIC_NHOST_SUBDOMAIN=${{ secrets.EXPO_PUBLIC_NHOST_SUBDOMAIN }}" > .env.production
          echo "EXPO_PUBLIC_NHOST_REGION=${{ secrets.EXPO_PUBLIC_NHOST_REGION }}" >> .env.production
          echo "EXPO_PUBLIC_SKIP_SYNC=true" >> .env.production
          # Sentry DSN se inyecta automáticamente cuando secrets.EXPO_PUBLIC_SENTRY_DSN esté configurado
          if [ -n "${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}" ]; then
            echo "EXPO_PUBLIC_SENTRY_DSN=${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}" >> .env.production
          fi

      - name: Build PWA
        run: bun run build:web

      - name: Run E2E tests
        run: bunx playwright test

      - name: Verify secrets
        id: verify-secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::warning::VERCEL_TOKEN is not configured — deploy will be skipped"
            echo "secrets_ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "secrets_ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Vercel
        if: success() && steps.verify-secrets.outputs.secrets_ok == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          bunx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          bunx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          bunx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
