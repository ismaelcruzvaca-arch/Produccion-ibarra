name: CI/CD — E2E + Deploy Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(bunx playwright --version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build PWA
        env:
          EXPO_PUBLIC_NHOST_SUBDOMAIN: ${{ secrets.EXPO_PUBLIC_NHOST_SUBDOMAIN }}
          EXPO_PUBLIC_NHOST_REGION: ${{ secrets.EXPO_PUBLIC_NHOST_REGION }}
        run: bunx expo export -p web

      - name: Run E2E tests
        env:
          EXPO_PUBLIC_NHOST_SUBDOMAIN: ${{ secrets.EXPO_PUBLIC_NHOST_SUBDOMAIN }}
          EXPO_PUBLIC_NHOST_REGION: ${{ secrets.EXPO_PUBLIC_NHOST_REGION }}
        run: bunx playwright test

      - name: Deploy to Vercel
        if: success()
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          bunx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          bunx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          bunx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
