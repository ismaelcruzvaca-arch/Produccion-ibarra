# Nhost Environment Variables
# ===========================
# Copy or symlink this file as needed when configuring Nhost secrets.
#
# Set these in Nhost Dashboard → Settings → Environment Variables
# or via CLI: nhost secrets set KEY=VALUE
#
# Required by:
#   - hasura/triggers/sync-operator-role.json  (Event Trigger headers)
#   - nhost/functions/sync-role-metadata.ts     (Nhost Function)

# ── Nhost Admin Secret ─────────────────────────────────────────────────────────
# Used by: Event Trigger → Nhost Function → Management API
# Source: Nhost Dashboard → Settings → Hasura → Admin Secret
# WARNING: Keep this secret. Never commit it to git or log it.
NHOST_ADMIN_SECRET: ""

# ── Webhook Shared Secret ──────────────────────────────────────────────────────
# Used by: Nhost Function validates requests via x-webhook-secret header
# Purpose: Ensures only the Hasura Event Trigger (or authorized callers) can
#          invoke the sync-role-metadata function.
# Generate: openssl rand -hex 32  (or any strong random string)
NHOST_WEBHOOK_SECRET: ""

# ── Nhost Backend URL ──────────────────────────────────────────────────────────
# Used by: Nhost Function constructs the Management API URL
# Format:  https://<subdomain>.auth.<region>.nhost.run/v1
# Example: https://bbvfhqclotduzclfdiyd.auth.us-west-2.nhost.run/v1
NHOST_BACKEND_URL: ""
